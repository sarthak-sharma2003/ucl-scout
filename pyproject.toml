[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uclscout"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pulp", "pandas", "typer"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
uclscout = "uclscout.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
